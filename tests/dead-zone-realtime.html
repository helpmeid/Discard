<!doctype html><meta charset="utf-8"><title>Dead Zone multiplayer verification</title>
<style>body{background:#091714;color:#e5f2de;font:15px system-ui;margin:20px}h1{font-size:25px}pre{white-space:pre-wrap;padding:18px;background:#18372a;border-radius:10px}section{display:flex;gap:10px}iframe{width:50%;height:600px;border:1px solid #537e64}</style>
<h1>Dead Zone multiplayer verification</h1><pre id="result">Running real WebRTC, worker, prediction and background-host checks…</pre><section><iframe title="Host"></iframe><iframe title="Guest"></iframe></section>
<script>
(async()=>{
 const result=document.querySelector('#result'),checks=[],errors=[];const wait=ms=>new Promise(r=>setTimeout(r,ms));const assert=(value,label)=>{if(!value)throw Error(label);checks.push(label);result.textContent='Running…\n'+checks.join('\n');};
 const until=async(fn,label)=>{const end=performance.now()+15000;while(!fn()){if(performance.now()>end)throw Error('Timed out: '+label);await wait(30);}};
 let host,guest;
 try{
  const source=await(await fetch('../dead-zone.js')).text(),net=await(await fetch('../dead-zone-net.js')).text();
  const frames=[...document.querySelectorAll('iframe')];
  for(let i=0;i<2;i++){
   const frame=frames[i];frame.srcdoc='<base href="'+new URL('../',location.href).href+'"><body style="margin:0"></body>';await new Promise(r=>frame.onload=r);
   const w=frame.contentWindow,id=i?'guest':'host',other=i?'host':'guest';if(i)guest=w;else host=w;
   w.addEventListener('error',e=>errors.push(id+': '+e.message));w.currentUser={id};w.state={friends:{host:{},guest:{}}};w.viewPerson=id=>({displayName:id==='host'?'Ranger':'Medic'});w.connectTo=()=>{};
   w.eval(net);w.pc=new w.RTCPeerConnection({iceServers:[]});w.reliable=w.pc.createDataChannel('control',{negotiated:true,id:0,ordered:true});w.stats={fast:0,bytes:0,dropped:0,reliable:0};let count=0;
   const deliver=(d,fast)=>{const n=++count;if(fast&&n%7===0){w.stats.dropped++;return;}w.setTimeout(()=>w.deadZoneHandle(other,d),80+(fast?(n*17)%35:0));};
   w.reliable.onmessage=e=>deliver(JSON.parse(e.data),false);
   w.transport=new w.DeadZoneNet.RealtimeTransport({getConnection:()=>({peerConnection:w.pc}),allowed:()=>true,receive:(id,d)=>deliver(d,true)});w.transport.open(other);
   w.sendTo=(id,d)=>{w.stats.reliable++;w.reliable.send(JSON.stringify(d));return true;};w.deadZoneSendRealtime=(id,d)=>{const ok=w.transport.send(id,d);if(ok){w.stats.fast++;w.stats.bytes+=JSON.stringify(d).length;}return ok;};
   w.eval(source.replace('window.openDeadZone=open;',`window.dzTest={world:()=>world,session:()=>session,worker:()=>hostWorker,prediction,saveGame,stopDrawing(){window.requestAnimationFrame=()=>0;releaseControls();},aim(x,y){mouse.x=x;mouse.y=y;}};window.openDeadZone=open;`));
  }
  const gather=pc=>new Promise(r=>{if(pc.iceGatheringState==='complete')r();else pc.addEventListener('icegatheringstatechange',()=>{if(pc.iceGatheringState==='complete')r();});});
  await host.pc.setLocalDescription(await host.pc.createOffer());await gather(host.pc);await guest.pc.setRemoteDescription(host.pc.localDescription);await guest.pc.setLocalDescription(await guest.pc.createAnswer());await gather(guest.pc);await host.pc.setRemoteDescription(guest.pc.localDescription);
  await until(()=>host.reliable.readyState==='open'&&guest.reliable.readyState==='open'&&[...host.transport.channels.values()][0].channel.readyState==='open','WebRTC');assert(true,'Connected two real WebRTC peers');
  host.openDeadZone();guest.deadZoneHandle('host',{v:1,t:'dz-invite',id:host.dzTest.session().id});guest.openDeadZone();[...guest.document.querySelectorAll('button')].find(b=>b.textContent==='Join Ranger').click();await until(()=>host.dzTest.world().players.length===2,'lobby');
  const w=host.dzTest.world();w.between=100;w.remaining=10;for(const p of w.players)p.invuln=100;const p=w.players[0];p.x=1800;p.y=1300;p.inventory.push('shotgun');p.primary=p.weapon='shotgun';p.ammo=80;
  for(let i=0;i<65;i++)w.zombies.push({netId:i+1,x:1930+i%8*26,y:1190+Math.floor(i/8)*28,hp:30,maxHp:30,kind:'walker',speed:20,attack:0});w.zombieSerial=65;
  [...host.document.querySelectorAll('button')].find(b=>b.textContent.includes('DEPLOY')).click();await until(()=>guest.dzTest.session().phase==='play'&&!!host.dzTest.worker(),'worker deployment');assert(true,'Started worker simulation with 65 infected');
  const key=(win,code,down)=>win.dispatchEvent(new win.KeyboardEvent(down?'keydown':'keyup',{code,key:code,bubbles:true}));
  const x=guest.dzTest.prediction.state.x,t=performance.now();key(guest,'KeyD',true);key(guest,'ShiftLeft',true);await until(()=>guest.dzTest.prediction.state.x>x+.1,'local prediction');const response=performance.now()-t;
  await wait(500);key(guest,'KeyD',false);key(guest,'ShiftLeft',false);await wait(800);assert(host.dzTest.world().players[1].x>x+20,'Guest movement reaches host under 160 ms RTT, jitter and packet loss');assert(guest.dzTest.prediction.pending.length<40,'Unacknowledged input stays bounded');assert(guest.dzTest.prediction.lastError<3,'Reconciliation stays within 3 pixels');
  const inventory=guest.document.querySelector('#dzInventoryToggle');await wait(300);assert(inventory.isConnected,'HUD retains controls instead of rebuilding them');inventory.click();assert(guest.document.querySelector('.dz-inventory').style.display==='flex','Inventory opens');key(guest,'Escape',true);key(guest,'Escape',false);
  host.dzTest.aim(580,300);host.document.querySelector('canvas').dispatchEvent(new host.MouseEvent('mousedown',{bubbles:true}));await wait(120);host.dispatchEvent(new host.MouseEvent('mouseup'));await until(()=>guest.dzTest.world().blood.length>0,'combat replication');assert(host.dzTest.world().score>0,'Worker combat and loot remain authoritative');
  const time=host.dzTest.world().time,oldX=host.dzTest.world().players[1].x;host.dzTest.stopDrawing();key(guest,'KeyA',true);await wait(1500);key(guest,'KeyA',false);assert(host.dzTest.world().time>time+1,'Match advances with host animation loop completely stopped');assert(host.dzTest.world().players[1].x<oldX-40,'Guest keeps playing while host does no rendering');
  host.dzTest.saveGame();await until(()=>!!host.localStorage.getItem('deadzone-save-v1-host'),'worker save');const saved=JSON.parse(host.localStorage.getItem('deadzone-save-v1-host'));assert(saved.version===1&&saved.world.players.length===1&&saved.world.zombies.every(z=>Number.isFinite(z.speed)),'Worker save preserves format, host inventory and enemy simulation data');assert(errors.length===0,'No browser errors');
  result.textContent='PASS — '+checks.length+' checks\n'+checks.join('\n')+'\n\n'+JSON.stringify({inputResponseMs:Math.round(response),pending:guest.dzTest.prediction.pending.length,reconciliationError:guest.dzTest.prediction.lastError,host:host.stats,guest:guest.stats,errors},null,2);document.title='PASS — Dead Zone multiplayer';
 }catch(e){result.textContent='FAIL — '+e.stack+'\n\n'+checks.join('\n')+'\nErrors: '+JSON.stringify(errors);document.title='FAIL — Dead Zone multiplayer';}
})();
</script>
