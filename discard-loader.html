<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Discard</title>
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/helpmeid/Discard/main/discard-icon.png">
  <style>body { margin: 0; display: grid; min-height: 100vh; place-items: center; font: 16px system-ui, sans-serif; background: #1e1f22; color: #ddd; text-align: center; }</style>
</head>
<body>
  <p id="status">Loading the latest Discard…</p>
  <script>
    // Download only this file once. It fetches the newest Discard from GitHub on every open,
    // so updates arrive automatically. Keep using the same copy of this file so your data stays put.
    (async () => {
      const base = "https://raw.githubusercontent.com/helpmeid/Discard/main/";
      const cacheKey = "discard-loader-cache";
      const status = document.getElementById("status");
      const get = async name => {
        // A fresh URL on every attempt bypasses cached raw file responses.
        const url = base + name + "?update=" + Date.now() + "-" + Math.random().toString(36).slice(2);
        const response = await fetch(url, { cache: "no-store", mode: "cors" });
        if (!response.ok) throw new Error(name + " " + response.status);
        return response.text();
      };
      const inline = code => code.replace(/<\/script/gi, "<\\/script").replace(/<!--/g, "<\\!--");

      let html;
      let offlineReason = "";
      try {
        // Retry when GitHub's edge servers briefly disagree about which
        // version of index.html/app.js is current.
        let page, scripts, sources, valid = false;
        for (let attempt = 0; attempt < 3 && !valid; attempt++) {
          page = await get("index.html");
          scripts = [...page.matchAll(/<script src="((?!https?:)[^"]+)"><\/script>/g)];
          sources = await Promise.all(scripts.map(match => get(match[1].split("?")[0])));
          const appIndex = scripts.findIndex(match => match[1].startsWith("app.js?v="));
          const expected = appIndex < 0 ? "" : scripts[appIndex][1].split("?v=")[1];
          const version = appIndex < 0 ? "" : sources[appIndex].match(/const APP_VERSION\s*=\s*["']([^"']+)/)?.[1];
          valid = !!expected && version === expected;
          if (!valid) status.textContent = "Checking the newest Discard version…";
        }
        if (!valid) throw new Error("Downloaded files have mismatched version numbers");
        scripts.forEach((match, index) => {
          page = page.replace(match[0], () => "<script>" + inline(sources[index]) + "<" + "/script>");
        });
        html = page.replace("<head>", `<head><base href="${base}">`);
        try { localStorage.setItem(cacheKey, html); } catch {}
      } catch (error) {
        offlineReason = error?.message || "The latest download failed";
        try { html = localStorage.getItem(cacheKey); } catch {}
        if (!html) {
          status.textContent = "Could not load Discard. Check your internet connection and reload.";
          return;
        }
      }
      document.open();
      document.write(html);
      document.close();
      if (offlineReason) {
        const warning = document.createElement("div");
        warning.setAttribute("role", "status");
        warning.style.cssText = "position:fixed;bottom:36px;left:12px;z-index:2147483646;max-width:min(420px,90vw);background:#7d332d;color:#fff;padding:10px 14px;border-radius:7px;font:13px system-ui;box-shadow:0 3px 16px #0005";
        warning.textContent = "Discard could not fetch the newest version (" + offlineReason + "). You are viewing a saved older copy. Check your connection and reopen the loader to update.";
        document.body.appendChild(warning);
      }
    })();
  </script>
</body>
</html>
